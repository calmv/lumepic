services:
  app:
    build: .
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      TRUST_PROXY: "true"
      TRUSTED_PROXY_IPS: ${CADDY_PROXY_IP:-172.30.249.10}
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    pids_limit: 128
    networks:
      backend:
        ipv4_address: ${APP_INTERNAL_IP:-172.30.249.3}

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public DNS name in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      backend:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.249.10}

networks:
  backend:
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.249.0/24}

volumes:
  caddy_data:
  caddy_config:
